# Pipeline de nexus-dominio (sección 2.5): un repositorio, dos imágenes (dominio y carga).
#   pull request hacia dev o main -> pruebas (con PostgreSQL real) y build, SIN publicar
#   push a main                    -> pruebas, build y publicación con sha-<commit> y latest
#   tag ep2 sobre main             -> publica las mismas imágenes con el tag ep2
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: [ep2]

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus_ci@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias
        run: pip install -r carga/requirements.txt -r dominio/requirements-dev.txt

      - name: Pruebas del cargador
        run: python -m unittest discover -s carga/tests -v

      - name: Carga inicial y prueba de idempotencia (la segunda ejecución no inserta filas)
        run: |
          python -m carga.cargar
          python -m carga.cargar | tee segunda.log
          test "$(grep -c 'nuevas=0' segunda.log)" -eq 3

      - name: Pruebas del dominio (PostgreSQL real, IA simulada)
        working-directory: dominio
        run: python -m pytest -q

  imagenes:
    needs: pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [dominio, carga]
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexus-${{ matrix.servicio }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Etiquetas y labels (incluye org.opencontainers.image.revision)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar fuera de los pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.servicio }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
