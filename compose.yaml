# Sistema completo de Nexus Retail (EP3). En EC2 se levanta con:
#   docker compose -p equipoNN up -d
# y se abre https://52-1-100-14.sslip.io
#
# Solo se usan imágenes publicadas en GHCR fijadas por digest (inmutables), linux/amd64,
# sin bind mounts de código, healthcheck y límites en cada servicio propio, y nada secreto
# (ver .env.example). Digests EP3 comprobados por org.opencontainers.image.revision:
#   gateway 85956a9 - dominio y worker de361d7 - carga da31ac2 - front 5c5612a - IA b0b277df
# (la imagen de IA no publica la etiqueta de revisión).
# Caddy publica 80/443 y hace de terminación TLS; el gateway solo escucha en la red interna.
#
# Límites (cpus / mem_limit): punto de partida con la memoria medida en local tras 40 predicciones
# (IA 185 MB, cada réplica de dominio 73 MB, PostgreSQL 119 MB, Nginx < 10 MB). Se confirman con
#   docker stats --no-stream
# bajo carga y se justifican en el capítulo 7.2.

services:
  gateway:
    image: ghcr.io/ivvnzz/nexus-gateway@sha256:59c10726b5f49e16f756f139ee6834f2c8fa0b87c68741846494f7b39a907e5e
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    cpus: "0.25"
    mem_limit: 64m

  front:
    image: ghcr.io/jaimebarrales/nexus-front@sha256:af7c0f5d09c4903b21d7aab46f88968b4cdedb7668d30ae924e6f52da218bbd8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    cpus: "0.25"
    mem_limit: 32m

  dominio:
    image: ghcr.io/ivvnzz/nexus-dominio@sha256:7fddba1ce6fa5d95e1c56f744149daa21c1db788c116089f6d59c8461fcd361f
    restart: unless-stopped
    deploy:
      replicas: 2          # el gateway reparte entre las dos (DNS de Docker + resolve en Nginx)
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@db:5432/nexus
      IA_URL: http://ia:8000
      IA_TIMEOUT_S: "4"
      RABBITMQ_URL: amqp://nexus:${RABBITMQ_PASSWORD:-nexus_dev}@rabbitmq:5672/
      CAMPANAS_API_KEY: ${CAMPANAS_API_KEY:-}

    depends_on:
      db:
        condition: service_healthy
      carga:
        condition: service_completed_successfully
      # No depende de la IA: si la IA no está, el dominio responde con su lista de respaldo.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.5"
    mem_limit: 192m

  ia:
    image: ghcr.io/gaborilincio/modelo-nexus@sha256:b0b277df392b7e5acba265e30a61d00f0a34e99cef480ab9a0c068f5a9555510
    restart: unless-stopped
    environment:
      SAGEMAKER_ENDPOINT: nexus-reco
      SAGEMAKER_MODEL_VERSION: nexus-reco-20261119-012857
      AWS_DEFAULT_REGION: us-east-1
      # La primera invocación serverless puede tardar ~20 s: margen sobre el timeout del dominio.
      SAGEMAKER_TIMEOUT: "10"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    cpus: "1.0"
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nexus_dev}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  worker:
    image: ghcr.io/ivvnzz/nexus-dominio@sha256:7fddba1ce6fa5d95e1c56f744149daa21c1db788c116089f6d59c8461fcd361f
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@db:5432/nexus
      RABBITMQ_URL: amqp://nexus:${RABBITMQ_PASSWORD:-nexus_dev}@rabbitmq:5672/
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODELO: ${NVIDIA_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    cpus: "0.5"
    mem_limit: 256m
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: "0.5"
    mem_limit: 256m

  carga:
    image: ghcr.io/ivvnzz/nexus-carga@sha256:04f5009d73756b4852697a318403816f5142f422e298dd017edd08e9f68d8584
    restart: "no"          # se ejecuta una vez; si corre de nuevo no duplica filas (ON CONFLICT DO NOTHING)
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@db:5432/nexus
    depends_on:
      db:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    depends_on:
      - gateway

volumes:
  datos-db:
  caddy_datos:
